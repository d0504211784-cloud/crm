<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CRM משכנתאות - Ultra Modern</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root { --primary: #4361ee; --bg: #f8f9fd; --todo-bg: #ffffff; }
        
        body { 
            font-family: 'Heebo', sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            padding: 20px; 
            color: #2b2d42;
            display: flex; /* תצוגה צד לצד */
            gap: 25px;
            align-items: flex-start;
        }

        .hidden { display: none !important; }

        /* תוכן מרכזי בימין */
        .main-content { flex: 1; min-width: 0; }

        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 30px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.04); 
            margin-bottom: 20px; 
        }
        
        .main-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-box { padding: 20px; border-radius: 24px; color: white; text-align: center; cursor: pointer; transition: 0.3s; }
        .stat-box:hover { transform: translateY(-5px); filter: brightness(1.1); }
        .stat-box div:last-child { font-size: 32px; font-weight: 900; }
        
        .stat-total { background: linear-gradient(135deg, #4361ee, #4895ef); }
        .stat-approved { background: linear-gradient(135deg, #2ec4b6, #80ffdb); color: #011627; }
        .stat-followup { background: linear-gradient(135deg, #7209b7, #b5179e); } 
        .stat-leads { background: linear-gradient(135deg, #ff9f1c, #ffbf69); color: #011627; }

        /* שורת משימות בצד שמאל - Left Sidebar */
        .todo-section { 
            width: 320px; 
            background: #fff; 
            padding: 25px; 
            border-radius: 25px; 
            border: 2px solid #f1f5f9; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            position: sticky;
            top: 20px;
            height: fit-content;
            order: 2; /* מבטיח שזה יהיה בצד שמאל ב-RTL */
        }
        
        .todo-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; color: #ef476f; font-weight: 800; }
        .todo-input-group { display: flex; gap: 8px; margin-bottom: 20px; }
        .todo-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-radius: 12px; background: #f8fafc; margin-bottom: 8px; border: 1px solid transparent; }
        .todo-text { flex: 1; margin-right: 12px; font-weight: 500; font-size: 14px; }
        .todo-done { text-decoration: line-through; opacity: 0.5; }
        .todo-check { width: 18px; height: 18px; cursor: pointer; }

        .customer-card { background: white; margin-bottom: 15px; padding: 20px; border-radius: 25px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #f1f5f9; transition: 0.3s; border-right: 10px solid #ccc; cursor: pointer; }
        .customer-card:hover { transform: translateX(-5px); border-color: var(--primary); }
        
        .avatar { width: 50px; height: 50px; border-radius: 15px; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 900; margin-left: 15px; }
        .tag-pill { font-size: 12px; font-weight: 600; padding: 5px 15px; border-radius: 50px; margin-right: 8px; display: inline-flex; align-items: center; gap: 5px; }
        .tag-agent { background: #e0e7ff; color: #4361ee; }
        .tag-goal { background: #f3e8ff; color: #7209b7; }
        
        .whatsapp-link { text-decoration: none; color: #25d366; font-size: 14px; font-weight: bold; margin-right: 15px; }
        
        input, select, textarea { width: 100%; padding: 16px; margin-top: 10px; border: 1px solid #e2e8f0; border-radius: 15px; font-size: 16px; outline: none; box-sizing: border-box; }
        .save-btn { background: #10b981; color: white; padding: 20px; border: none; border-radius: 18px; width: 100%; cursor: pointer; font-size: 18px; font-weight: 800; margin-top: 40px; }
        .back-btn { background:#f1f5f9; border:none; padding:12px 25px; border-radius:50px; cursor:pointer; margin-bottom:30px; font-weight:bold; color:#64748b; }
        
        /* כפתור אקסל */
        .excel-btn { background: #1d6f42; color: white; padding: 12px 25px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .excel-btn:hover { background: #155231; transform: scale(1.05); }

        .bank-card { border: 1px solid #f1f5f9; padding: 20px; margin-bottom: 20px; border-radius: 20px; background: #f8fafc; }
        .track-item { display: flex; gap: 10px; margin-bottom: 10px; }
        
        @media (max-width: 1000px) {
            body { flex-direction: column; }
            .todo-section { width: 100%; position: static; order: 2; }
            .main-content { width: 100%; order: 1; }
        }
    </style>
</head>
<body>
    <!-- תוכן מרכזי - יופיע בימין בזכות ה-order ב-CSS -->
    <div class="main-content">
        <div id="homePage" class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px;">
                <h1 style="margin:0; font-size: 36px; font-weight: 900; color: #1e293b;">CRM משכנתאות</h1>
                <div style="display: flex; gap: 12px;">
                    <button class="excel-btn" onclick="exportToExcel()">📊 ייצוא לאקסל</button>
                    <button class="save-btn" style="margin:0; width:auto; padding:12px 30px;" onclick="addNewCustomer()">+ לקוח חדש</button>
                </div>
            </div>
            
            <div class="main-stats-grid">
                <div class="stat-box stat-total" onclick="setFilter('all')"><div>👤 סה"כ</div><div id="stat-total">0</div></div>
                <div class="stat-box stat-approved" onclick="setFilter('approved')"><div>🏆 מאושרים</div><div id="stat-approved">0</div></div>
                <div class="stat-box stat-followup" onclick="setFilter('followup')"><div>📅 בטיפול</div><div id="stat-followup">0</div></div>
                <div class="stat-box stat-leads" onclick="setFilter('leads')"><div>🔥 חדשים</div><div id="stat-leads">0</div></div>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 25px; align-items: center; justify-content: center; background: #f1f5f9; padding: 10px; border-radius: 50px;">
                <button class="filter-btn active" onclick="setAgentFilter('all')" style="padding:8px 20px; border-radius:50px; border:none; cursor:pointer;">הכל</button>
                <button class="filter-btn" onclick="setAgentFilter('דורון')" style="padding:8px 20px; border-radius:50px; border:none; cursor:pointer;">דורון</button>
                <button class="filter-btn" onclick="setAgentFilter('יעקב')" style="padding:8px 20px; border-radius:50px; border:none; cursor:pointer;">יעקב</button>
                <button class="filter-btn" onclick="setAgentFilter('אביב')" style="padding:8px 20px; border-radius:50px; border:none; cursor:pointer;">אביב</button>
            </div>
            
            <input type="text" id="searchInput" onkeyup="filterNames()" placeholder="חיפוש לקוח לפי שם, טלפון או נציג..." style="border-radius:50px; padding:18px 25px;">
            <div id="customerList" style="margin-top:25px;"></div>
        </div>

        <!-- תפריט פנימי 2X2 -->
        <div id="customerMenuPage" class="container hidden">
            <button class="back-btn" onclick="showPage('homePage')">→ חזרה לרשימה הכללית</button>
            <h2 id="selectedNameTitle" style="text-align: center; font-size: 34px; font-weight:900; color: #1e293b; margin-bottom: 40px;"></h2>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div onclick="showPage('idPage')" style="background: linear-gradient(135deg, #4361ee, #4cc9f0); padding: 45px; border-radius: 30px; color: white; text-align: center; cursor: pointer; transition: 0.3s;" onmouseover="this.style.transform='scale(1.03)'" onmouseout="this.style.transform='scale(1)'">
                    <div style="font-size: 45px; margin-bottom: 15px;">📄</div>
                    <h2 style="margin:0; font-size: 24px;">מסמכים</h2>
                    <p style="opacity: 0.8;">ניהול קבצים ותעודות זהות</p>
                </div>
                <div onclick="showPage('statusPage')" style="background: linear-gradient(135deg, #2ec4b6, #80ffdb); padding: 45px; border-radius: 30px; color: #011627; text-align: center; cursor: pointer; transition: 0.3s;" onmouseover="this.style.transform='scale(1.03)'" onmouseout="this.style.transform='scale(1)'">
                    <div style="font-size: 45px; margin-bottom: 15px;">🏦</div>
                    <h2 style="margin:0; font-size: 24px;">בנקים</h2>
                    <p style="opacity: 0.8;">תמהילים והצעות מאושרות</p>
                </div>
                <div onclick="showPage('extraPage')" style="background: linear-gradient(135deg, #7209b7, #f72585); padding: 45px; border-radius: 30px; color: white; text-align: center; cursor: pointer; transition: 0.3s;" onmouseover="this.style.transform='scale(1.03)'" onmouseout="this.style.transform='scale(1)'">
                    <div style="font-size: 45px; margin-bottom: 15px;">⚙️</div>
                    <h2 style="margin:0; font-size: 24px;">שונות</h2>
                    <p style="opacity: 0.8;">ביטוחים, תמחור והערות</p>
                </div>
                <div onclick="showPage('checklistPage')" style="background: linear-gradient(135deg, #ff9f1c, #ffbf69); padding: 45px; border-radius: 30px; color: #011627; text-align: center; cursor: pointer; transition: 0.3s;" onmouseover="this.style.transform='scale(1.03)'" onmouseout="this.style.transform='scale(1)'">
                    <div style="font-size: 45px; margin-bottom: 15px;">✅</div>
                    <h2 style="margin:0; font-size: 24px;">צ'ק ליסט</h2>
                    <p style="opacity: 0.8;">מעקב חוזה ומסמכים</p>
                </div>
            </div>
        </div>

        <!-- דפי פירוט -->
        <div id="idPage" class="container hidden">
            <button class="back-btn" onclick="showPage('customerMenuPage')">→ חזרה לתפריט לקוח</button>
            <h2>📄 מסמכי זיהוי ופרטים</h2>
            <label>טלפון לקוח:</label><input type="tel" id="custPhone" placeholder="05x-xxxxxxx">
            <label>סטטוס משפחתי:</label><select id="hasSpouse" onchange="toggleSpouseFields()"><option value="no">רווק/ה</option><option value="yes">נשוי/אה (בן זוג)</option></select>
            <div id="spouseFields" class="hidden">
                <label>שם בן/בת הזוג:</label><input type="text" id="spouseName">
                <label>טלפון בן/בת הזוג:</label><input type="tel" id="spousePhone">
            </div>
            <label>צילום ת.ז / חוזה:</label><input type="file" id="idUpload" onchange="previewFile(this)">
            <img id="idPreview" class="hidden" style="max-width:100%; margin-top:20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
            <button class="save-btn" onclick="saveAllData()">שמור שינויים בתיק</button>
        </div>

        <div id="statusPage" class="container hidden">
            <button class="back-btn" onclick="showPage('customerMenuPage')">→ חזרה לתפריט לקוח</button>
            <div style="background:var(--primary); padding:30px; border-radius:25px; color:white; margin-bottom:30px;">
                <h3 style="margin-top:0;">הוספת הצעה מבנק</h3>
                <div style="display:flex; gap:15px;">
                    <select id="bankSelector" style="flex:2; margin:0;"><option value="">בחר בנק...</option><option value="מזרחי טפחות">מזרחי טפחות</option><option value="לאומי">לאומי</option><option value="הפועלים">הפועלים</option><option value="דיסקונט">דיסקונט</option><option value="הבינלאומי">הבינלאומי</option><option value="חוץ בנקאי">חוץ בנקאי</option></select>
                    <button onclick="addBankToCase()" style="background:white; color:var(--primary); border:none; padding:10px 25px; border-radius:15px; font-weight:bold; cursor:pointer;">+ הוסף בנק</button>
                </div>
            </div>
            <div id="dynamicBankList"></div>
            <button class="save-btn" onclick="saveAllData()">שמור את כל התמהילים</button>
        </div>

        <div id="extraPage" class="container hidden">
            <button class="back-btn" onclick="showPage('customerMenuPage')">→ חזרה לתפריט לקוח</button>
            <label>נציג מטפל:</label><select id="assignedAgent"><option value="">בחר נציג...</option><option value="דורון">דורון</option><option value="יעקב">יעקב</option><option value="אביב">אביב</option></select>
            <label>מטרת התיק:</label><select id="caseGoal"><option value="">בחר מטרה...</option><option value="יד ראשונה">יד ראשונה</option><option value="יד שנייה">יד שנייה</option><option value="כל מטרה">כל מטרה</option><option value="מחזור פנימי">מחזור פנימי</option><option value="מחזור חיצוני">מחזור חיצוני</option><option value="הלוואה עסקית">הלוואה עסקית</option></select>
            <label>תמחור התיק (₪):</label><input type="number" id="casePricing" placeholder="0.00">
            <label>תאריך חזרה:</label><input type="date" id="followUpDate">
            <label>הערות לתיק:</label><textarea id="freeText" rows="6" placeholder="הקלד כאן הערות חשובות..."></textarea>
            <button class="save-btn" onclick="saveAllData()">שמור שונות</button>
        </div>

        <div id="checklistPage" class="container hidden">
            <button class="back-btn" onclick="showPage('customerMenuPage')">→ חזרה לתפריט לקוח</button>
            <h2>✅ צ'ק ליסט מסמכים</h2>
            <label>הכנסה:</label><select id="check-income"><option value="לא">❌ חסר</option><option value="כן">✅ התקבל</option></select>
            <label>עובר ושב:</label><select id="check-bank"><option value="לא">❌ חסר</option><option value="כן">✅ התקבל</option></select>
            <label>ניהול חשבון:</label><select id="check-account"><option value="לא">❌ חסר</option><option value="כן">✅ התקבל</option></select>
            <label>חוזה רכישה:</label><select id="check-contract"><option value="לא">❌ חסר</option><option value="כן">✅ התקבל</option></select>
            <button class="save-btn" onclick="saveAllData()">שמור צ'ק ליסט</button>
        </div>
    </div>

    <!-- שורת משימות - תופיע משמאל ב-RTL (order 2) -->
    <div class="todo-section">
        <div class="todo-header">
            <span>📌 משימות לביצוע</span>
            <span style="font-size: 12px; font-weight: 400; color: #64748b;">(גלובלי)</span>
        </div>
        <div class="todo-input-group">
            <input type="text" id="todoInput" placeholder="מה עושים היום?" style="margin:0; flex:1; padding: 12px; border-radius: 12px; font-size: 14px; border: 1px solid #e2e8f0;">
            <button onclick="addTodo()" style="background:var(--primary); color:white; border:none; padding:0 15px; border-radius:12px; cursor:pointer; font-weight:bold;">הוסף</button>
        </div>
        <div id="todoList"></div>
    </div>
<script>
let currentCustomer = "";
let currentFilter = "all", currentAgentFilter = "all";
let allCustomers = JSON.parse(localStorage.getItem('crm_customer_list')) || [];
let todos = JSON.parse(localStorage.getItem('crm_todos')) || [];

function showPage(p) {
    // הסתרת כל הדפים בתוך main-content
    document.querySelectorAll('.main-content .container').forEach(div => div.classList.add('hidden'));
    const target = document.getElementById(p);
    if (target) target.classList.remove('hidden');
    
    window.scrollTo(0,0);
    if (p === 'homePage') { renderCustomerList(); renderTodos(); }
    if (p === 'statusPage') loadDynamicBanks();
    if (['idPage', 'extraPage', 'checklistPage'].includes(p)) loadCustomerData();
}

function setFilter(f) { 
    currentFilter = f; 
    renderCustomerList(); 
}

function setAgentFilter(a) { 
    currentAgentFilter = a; 
    document.querySelectorAll('.filter-btn').forEach(b => {
        const isMatch = b.innerText === (a === 'all' ? 'הכל' : a);
        b.classList.toggle('active', isMatch);
        b.style.background = isMatch ? 'var(--primary)' : '#f1f5f9';
        b.style.color = isMatch ? 'white' : '#2b2d42';
    });
    renderCustomerList(); 
}

function renderCustomerList() {
    const list = document.getElementById('customerList');
    if (!list) return;
    list.innerHTML = '';
    let stats = { approved: 0, followup: 0, leads: 0 };

    allCustomers.forEach(name => {
        const data = JSON.parse(localStorage.getItem('crm_data_' + name)) || { bankData: [] };
        let isApp = (data.bankData || []).some(b => b.status === "אושר");
        let hasAct = (data.bankData || []).length > 0 || data.followUpDate || data.freeText;
        let cat = isApp ? "approved" : (hasAct ? "followup" : "leads");
        
        if (cat === "approved") stats.approved++; 
        else if (cat === "followup") stats.followup++; 
        else stats.leads++;

        if (currentFilter !== 'all' && currentFilter !== cat) return;
        if (currentAgentFilter !== 'all' && data.assignedAgent !== currentAgentFilter) return;

        let firstLetter = name.charAt(0);
        let phoneDigits = data.phone ? data.phone.replace(/\D/g, '') : '';
        let waLink = phoneDigits ? `<a href="https://wa.me{phoneDigits.startsWith('0') ? '972' + phoneDigits.substring(1) : phoneDigits}" target="_blank" class="whatsapp-link" onclick="event.stopPropagation()">🟢 WhatsApp</a>` : '';

        let div = document.createElement('div');
        div.className = 'customer-card';
        div.style.borderRightColor = isApp ? "#2ec4b6" : (hasAct ? "#7209b7" : "#ccc");
        div.onclick = () => openCustomer(name);
        div.innerHTML = `
            <div class="avatar">${firstLetter}</div>
            <div class="cust-info">
                <div class="cust-name">
                    ${name}
                    <span style="font-size:13px; color:#94a3b8; font-weight:400; margin-right:10px;">${data.phone || ''}</span>
                    ${waLink}
                </div>
                <div style="margin-top:8px;">
                    <span class="tag-pill tag-agent">👤 ${data.assignedAgent || 'ללא נציג'}</span>
                    <span class="tag-pill tag-goal">🎯 ${data.caseGoal || 'לא הוגדר'}</span>
                </div>
            </div>
            <button onclick="event.stopPropagation(); deleteCustomer('${name}')" style="border:none; background:none; cursor:pointer; font-size:20px; opacity:0.3;">🗑️</button>`;
        list.appendChild(div);
    });

    document.getElementById('stat-total').innerText = allCustomers.length;
    document.getElementById('stat-approved').innerText = stats.approved;
    document.getElementById('stat-followup').innerText = stats.followup;
    document.getElementById('stat-leads').innerText = stats.leads;
}

function exportToExcel() {
    let csv = "\uFEFFשם,טלפון,נציג,מטרה,סטטוס,תאריך חזרה,הערות\n";
    allCustomers.forEach(name => {
        const d = JSON.parse(localStorage.getItem('crm_data_' + name)) || {};
        let isApp = (d.bankData || []).some(b => b.status === "אושר");
        let status = isApp ? "מאושר" : ((d.bankData || []).length > 0 ? "בטיפול" : "חדש");
        
        let row = [
            name,
            d.phone || "",
            d.assignedAgent || "ללא",
            d.caseGoal || "",
            status,
            d.followUpDate || "",
            (d.freeText || "").replace(/\n/g, " ")
        ];
        csv += row.join(",") + "\n";
    });
    
    let blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    let link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.setAttribute("download", "crm_leads_" + new Date().toLocaleDateString() + ".csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

// לוגיקת TODO
function renderTodos() {
    const list = document.getElementById('todoList');
    if (!list) return;
    list.innerHTML = '';
    todos.forEach((t, i) => {
        const div = document.createElement('div');
        div.className = 'todo-item';
        div.innerHTML = `
            <input type="checkbox" class="todo-check" ${t.done ? 'checked' : ''} onclick="toggleTodo(${i})">
            <span class="todo-text ${t.done ? 'todo-done' : ''}">${t.text}</span>
            <button onclick="deleteTodo(${i})" style="border:none; background:none; cursor:pointer; opacity:0.3;">✕</button>`;
        list.appendChild(div);
    });
}

function addTodo() {
    const input = document.getElementById('todoInput');
    if(!input.value.trim()) return;
    todos.push({ text: input.value, done: false });
    localStorage.setItem('crm_todos', JSON.stringify(todos));
    input.value = '';
    renderTodos();
}

function toggleTodo(i) { todos[i].done = !todos[i].done; localStorage.setItem('crm_todos', JSON.stringify(todos)); renderTodos(); }
function deleteTodo(i) { todos.splice(i, 1); localStorage.setItem('crm_todos', JSON.stringify(todos)); renderTodos(); }

function filterNames() {
    let term = document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('.customer-card').forEach(card => {
        card.style.display = card.innerText.toLowerCase().includes(term) ? 'flex' : 'none';
    });
}

function addNewCustomer() {
    let n = prompt("שם לקוח חדש:");
    if (n && !allCustomers.includes(n)) {
        allCustomers.push(n);
        localStorage.setItem('crm_customer_list', JSON.stringify(allCustomers));
        renderCustomerList();
    }
}

function openCustomer(n) { 
    currentCustomer = n; 
    document.getElementById('selectedNameTitle').innerText = n; 
    showPage('customerMenuPage'); 
}

function deleteCustomer(n) { 
    if (confirm(`למחוק את ${n}?`)) { 
        allCustomers = allCustomers.filter(c => c !== n); 
        localStorage.removeItem('crm_data_' + n);
        localStorage.setItem('crm_customer_list', JSON.stringify(allCustomers)); 
        renderCustomerList(); 
    } 
}

function addBankToCase(bankName = null, bankStatus = "ממתין", tracks = []) {
    const name = bankName || document.getElementById('bankSelector').value;
    if (!name) return;
    const container = document.getElementById('dynamicBankList');
    const bankId = 'b' + Date.now();
    const div = document.createElement('div');
    div.className = 'bank-card'; div.id = bankId; div.dataset.bankName = name;
    div.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h4 style="margin:0;">🏦 ${name}</h4>
            <select class="bank-status" style="width:auto; margin:0;"><option value="ממתין" ${bankStatus==="ממתין"?'selected':''}>ממתין</option><option value="אושר" ${bankStatus==="אושר"?'selected':''}>אושר</option></select>
            <button onclick="this.parentElement.parentElement.remove(); calcTotals();" style="color:red; border:none; background:none; cursor:pointer;">מחק</button>
        </div>
        <div class="tracks-area"></div>
        <button onclick="addTrackRow('${bankId}')" style="width:100%; padding:10px; border-radius:10px; border:none; cursor:pointer;">+ הוסף מסלול</button>
        <div style="margin-top:10px;">סה"כ: <span class="bank-total">0</span> ₪</div>`;
    container.appendChild(div);
    if(tracks.length > 0) tracks.forEach(t => addTrackRow(bankId, t)); else addTrackRow(bankId);
    calcTotals();
}

function addTrackRow(bankId, trackData = {type:'', amt:'', rate:''}) {
    const area = document.querySelector(`#${bankId} .tracks-area`);
    const row = document.createElement('div'); row.className = 'track-item';
    const types = ["קבועה צמודה", "קבועה לא צמודה", "משתנה צמודה", "משתנה לא צמודה", "פריים"];
    row.innerHTML = `
        <select class="t-type" style="flex:2; margin:0;">${types.map(t=>`<option value="${t}" ${trackData.type===t?'selected':''}>${t}</option>`).join('')}</select>
        <input type="number" class="t-amt" placeholder="סכום" style="flex:1.5; margin:0;" value="${trackData.amt}" oninput="calcTotals()">
        <input type="number" step="0.01" class="t-rate" placeholder="%" style="flex:1; margin:0;" value="${trackData.rate}">
        <button onclick="this.parentElement.remove(); calcTotals();" style="border:none; background:none; cursor:pointer;">✕</button>`;
    area.appendChild(row); 
    calcTotals();
}

function calcTotals() {
    document.querySelectorAll('.bank-card').forEach(card => {
        let t = 0; 
        card.querySelectorAll('.t-amt').forEach(i => t += parseFloat(i.value) || 0);
        card.querySelector('.bank-total').innerText = t.toLocaleString();
    });
}

function saveAllData() {
    let ex = JSON.parse(localStorage.getItem('crm_data_' + currentCustomer)) || {};
    let data = {
        phone: document.getElementById('custPhone')?.value || "",
        spouseName: document.getElementById('spouseName')?.value || "",
        spousePhone: document.getElementById('spousePhone')?.value || "",
        assignedAgent: document.getElementById('assignedAgent')?.value || "",
        caseGoal: document.getElementById('caseGoal')?.value || "",
        casePricing: document.getElementById('casePricing')?.value || "",
        followUpDate: document.getElementById('followUpDate')?.value || "",
        freeText: document.getElementById('freeText')?.value || "",
        checklist: {
            income: document.getElementById('check-income')?.value || "לא",
            bank: document.getElementById('check-bank')?.value || "לא",
            account: document.getElementById('check-account')?.value || "לא",
            contract: document.getElementById('check-contract')?.value || "לא"
        },
        bankData: [],
        fileData: document.getElementById('idPreview')?.src.startsWith('data') ? document.getElementById('idPreview').src : (ex.fileData || "")
    };
    document.querySelectorAll('.bank-card').forEach(row => {
        let b = { name: row.dataset.bankName, status: row.querySelector('.bank-status').value, tracks: [] };
        row.querySelectorAll('.track-item').forEach(tr => {
            b.tracks.push({ type: tr.querySelector('.t-type').value, amt: tr.querySelector('.t-amt').value, rate: tr.querySelector('.t-rate').value });
        });
        data.bankData.push(b);
    });
    localStorage.setItem('crm_data_' + currentCustomer, JSON.stringify(data));
    alert("נשמר בהצלחה! ✅");
    showPage('homePage');
}

function loadCustomerData() {
    const d = JSON.parse(localStorage.getItem('crm_data_' + currentCustomer)) || {};
    if(document.getElementById('custPhone')) document.getElementById('custPhone').value = d.phone || '';
    if(document.getElementById('spouseName')) document.getElementById('spouseName').value = d.spouseName || '';
    if(document.getElementById('spousePhone')) document.getElementById('spousePhone').value = d.spousePhone || '';
    if(document.getElementById('assignedAgent')) document.getElementById('assignedAgent').value = d.assignedAgent || '';
    if(document.getElementById('caseGoal')) document.getElementById('caseGoal').value = d.caseGoal || '';
    if(document.getElementById('casePricing')) document.getElementById('casePricing').value = d.casePricing || '';
    if(document.getElementById('followUpDate')) document.getElementById('followUpDate').value = d.followUpDate || '';
    if(document.getElementById('freeText')) document.getElementById('freeText').value = d.freeText || '';
    
    if(d.checklist) {
        Object.keys(d.checklist).forEach(k => {
            let el = document.getElementById('check-' + k);
            if(el) el.value = d.checklist[k];
        });
    }
    
    const img = document.getElementById('idPreview');
    if(d.fileData && img) { img.src = d.fileData; img.classList.remove('hidden'); } else if(img) { img.classList.add('hidden'); }
    toggleSpouseFields();
}

function loadDynamicBanks() {
    const list = document.getElementById('dynamicBankList'); 
    if(!list) return;
    list.innerHTML = '';
    const d = JSON.parse(localStorage.getItem('crm_data_' + currentCustomer)) || {};
    if(d.bankData) d.bankData.forEach(b => addBankToCase(b.name, b.status, b.tracks));
}

function toggleSpouseFields() {
    const sel = document.getElementById('hasSpouse');
    if(sel && document.getElementById('spouseFields')) {
        document.getElementById('spouseFields').classList.toggle('hidden', sel.value === 'no');
    }
}

function previewFile(input) {
    const reader = new FileReader();
    reader.onload = e => { 
        const preview = document.getElementById('idPreview');
        if(preview) { preview.src = e.target.result; preview.classList.remove('hidden'); }
    };
    if(input.files && input.files[0]) reader.readAsDataURL(input.files[0]);
}

window.onload = () => { renderCustomerList(); renderTodos(); };
</script>
</body>
</html>
