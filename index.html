<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM CRM - Mortgage Elite Pro V5</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root { 
            --primary: #4361ee; 
            --bg: #f8fafc; 
            --text: #1e293b;
            --success: #10b981;
            --danger: #ef476f;
            --warning: #ff9f1c;
            --border: #e2e8f0;
        }
        
        body { font-family: 'Heebo', sans-serif; background: var(--bg); margin: 0; color: var(--text); display: flex; min-height: 100vh; }
        .hidden { display: none !important; }

        /* Sidebar Navigation */
        nav { width: 280px; background: white; border-left: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 10px; position: sticky; top: 0; height: 100vh; box-sizing: border-box; box-shadow: 2px 0 10px rgba(0,0,0,0.02); overflow-y: auto; }
        .nav-logo { font-size: 26px; font-weight: 900; color: var(--primary); text-align: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 10px; }
        
        /* To-Do Sidebar (Top) */
        .todo-sidebar { background: #f1f5f9; padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid var(--border); }
        .todo-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
        .todo-item:last-child { border: none; }

        .nav-item { padding: 12px 15px; border-radius: 12px; cursor: pointer; transition: 0.3s; font-weight: bold; border: none; background: none; text-align: right; width: 100%; color: var(--text); font-size: 16px; }
        .nav-item:hover, .nav-item.active { background: #eff6ff; color: var(--primary); }

        /* Quick Calculator Sidebar */
        .calc-sidebar { background: #1e293b; color: white; padding: 18px; border-radius: 18px; margin-top: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .calc-sidebar label { font-size: 11px; opacity: 0.8; display: block; margin-bottom: 4px; }
        .calc-sidebar input { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; margin-bottom: 10px; padding: 10px; border-radius: 8px; width: 100%; box-sizing: border-box; outline: none; }
        .calc-res-box { background: var(--primary); padding: 10px; border-radius: 12px; text-align: center; }

        /* Main Content */
        main { flex: 1; padding: 40px; box-sizing: border-box; overflow-y: auto; }
        .alert-reminder { background: #fee2e2; color: #991b1b; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #fecaca; font-weight: bold; }
        .alert-reminder span.clickable { text-decoration: underline; cursor: pointer; margin-right: 8px; transition: 0.2s; }
        .alert-reminder span.clickable:hover { color: var(--danger); }
        
        .glass-card { background: white; border-radius: 24px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border); margin-bottom: 25px; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 30px; }
        .stat-box { padding: 18px; border-radius: 20px; text-align: center; cursor: pointer; color: white; transition: 0.3s; }
        .stat-box:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }

        /* Customer Cards */
        .customer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .cust-card { background: white; border: 1px solid var(--border); border-radius: 20px; padding: 20px; cursor: pointer; transition: 0.3s; position: relative; }
        .cust-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 12px 20px rgba(0,0,0,0.05); }
        .status-pill { font-size: 10px; padding: 4px 10px; border-radius: 50px; font-weight: bold; color: white; margin-bottom: 10px; display: inline-block; }

        /* Form Components */
        label { display: block; font-weight: bold; margin: 15px 0 5px; font-size: 14px; color: #64748b; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; box-sizing: border-box; outline: none; font-family: inherit; }
        .btn { padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 14px; }
        .btn-primary { background: var(--primary); color: white; }
        
        .bank-item { background: #f8fafc; border: 1px solid var(--border); padding: 20px; border-radius: 20px; margin-bottom: 20px; }
        .track-row { display: grid; grid-template-columns: 2fr 1.5fr 1fr 1fr 1fr 40px; gap: 8px; margin-top: 10px; align-items: center; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-logo">DOM CRM</div>
        
        <div class="todo-sidebar">
            <div style="font-weight:900; font-size:14px; margin-bottom:10px; color:var(--primary);">📌 משימות לביצוע</div>
            <div id="todo-list"></div>
            <input type="text" id="todo-input" placeholder="הוסף משימה..." onkeydown="if(event.key==='Enter') addTodo()" style="margin-top:10px; padding:8px; font-size:12px;">
        </div>

        <button id="btn-nav-dash" class="nav-item active" onclick="showSection('dash')">🏠 דאשבורד ניהולי</button>
        <button id="btn-nav-list" class="nav-item" onclick="showSection('full-list')">👥 מאגר לקוחות מלא</button>
        <button class="btn btn-primary" onclick="addNewCustomer()" style="margin-top: 10px;">+ לקוח חדש</button>
        
        <div class="calc-sidebar">
            <div style="font-weight:900; margin-bottom:12px; color:var(--warning); text-align:center;">🧮 מחשבון החזר</div>
            <label>סכום הלוואה (₪)</label><input type="number" id="side-amt" oninput="sideCalc()">
            <label>ריבית שנתית (%)</label><input type="number" id="side-rate" step="0.1" oninput="sideCalc()">
            <label>תקופה (שנים)</label><input type="number" id="side-years" oninput="sideCalc()">
            <div class="calc-res-box"><div id="side-res" style="font-size:20px; font-weight:900;">₪ 0</div></div>
        </div>

        <div style="margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding-top:15px;">
            <button class="btn" style="background:#64748b; color:white; padding:8px; font-size:11px;" onclick="exportFullBackup()">💾 גיבוי</button>
            <button class="btn" style="background:#94a3b8; color:white; padding:8px; font-size:11px;" onclick="document.getElementById('importFile').click()">📂 שחזור</button>
            <input type="file" id="importFile" class="hidden" onchange="importFullBackup(event)">
        </div>
    </nav>

    <main>
        <!-- פס תזכורות דינמי עם קישורים לחיצים -->
        <div id="reminder-alert" class="alert-reminder hidden"></div>

        <!-- דאשבורד ניהולי -->
        <section id="dash">
            <h1 style="margin-bottom: 25px; font-weight: 900;">מרכז בקרה</h1>
            <div class="stats-grid">
                <div class="stat-box" style="background: var(--primary);" onclick="setFilter('all')"><div style="font-size: 28px; font-weight: 900;" id="stat-all">0</div><div style="font-size: 13px;">סה"כ פעילים</div></div>
                <div class="stat-box" style="background: var(--success);" onclick="setFilter('approved')"><div style="font-size: 28px; font-weight: 900;" id="stat-app">0</div><div style="font-size: 13px;">מאושרים</div></div>
                <div class="stat-box" style="background: var(--warning);" onclick="setFilter('process')"><div style="font-size: 28px; font-weight: 900;" id="stat-proc">0</div><div style="font-size: 13px;">בתהליך</div></div>
                <div class="stat-box" style="background: #6366f1;" onclick="setFilter('lead')"><div style="font-size: 28px; font-weight: 900;" id="stat-lead">0</div><div style="font-size: 13px;">לידים חדשים</div></div>
                <div class="stat-box" style="background: #94a3b8;" onclick="setFilter('archive')"><div style="font-size: 28px; font-weight: 900;" id="stat-arc">0</div><div style="font-size: 13px;">ארכיון</div></div>
            </div>
            <div class="glass-card" style="padding: 15px;">
                <div style="display: flex; gap: 15px; align-items: center;">
                    <select id="filter-agent" onchange="renderGrids()" style="width: 140px; margin:0;"><option value="all">כל הנציגים</option><option value="דורון">דורון</option><option value="יעקב">יעקב</option><option value="אביב">אביב</option></select>
                    <input type="text" id="search-dash" placeholder="חיפוש לפי שם..." onkeyup="renderGrids()" style="flex:1; margin:0;">
                </div>
            </div>
            <div id="dash-grid" class="customer-grid"></div>
        </section>

        <!-- מאגר מלא -->
        <section id="full-list" class="hidden">
            <h1 style="margin-bottom: 25px; font-weight: 900;">מאגר לקוחות מלא</h1>
            <div class="glass-card"><input type="text" id="search-full" placeholder="חיפוש חופשי במאגר..." onkeyup="renderGrids()"></div>
            <div id="full-grid" class="customer-grid"></div>
        </section>

        <!-- עורך לקוח -->
        <section id="editor" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <button class="btn" style="background: #f1f5f9; color: #64748b;" onclick="goBack()">→ חזרה</button>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <h2 id="edit-title" style="margin:0; font-weight:900;"></h2>
                    <button class="btn" onclick="renameCustomer()" style="background:none; border:none; cursor:pointer; font-size:18px;" title="ערוך שם">✏️</button>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn" id="arc-toggle-btn" onclick="toggleArchive()"></button>
                    <button class="btn btn-primary" onclick="saveAllData()" style="background:var(--success);">💾 שמור שינויים</button>
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 25px;">
                <div class="glass-card">
                    <label>נציג מטפל:</label>
                    <select id="c-agent"><option value="דורון">דורון</option><option value="יעקב">יעקב</option><option value="אביב">אביב</option></select>
                    
                    <label>טלפון:</label><input type="tel" id="c-phone">

                    <label>בנק לניהול עו"ש:</label>
                    <select id="c-bank-main">
                        <option value="">-- בחר בנק --</option>
                        <option value="לאומי">לאומי</option><option value="הפועלים">הפועלים</option><option value="מזרחי טפחות">מזרחי טפחות</option>
                        <option value="דיסקונט">דיסקונט</option><option value="הבינלאומי">הבינלאומי</option><option value="יהב">יהב</option><option value="מרכנתיל">מרכנתיל</option><option value="וואן זירו">One Zero</option>
                    </select>

                    <label>קישור לבן/בת זוג:</label>
                    <select id="c-partner"><option value="">ללא קישור</option></select>
                    
                    <label>מטרה:</label>
                    <select id="c-goal">
                        <option value="רכישה יד ראשונה">רכישה יד ראשונה</option><option value="רכישה יד שנייה">רכישה יד שנייה</option><option value="מחזור פנימי">מחזור פנימי</option><option value="מחזור חיצוני">מחזור חיצוני</option><option value="כל מטרה">כל מטרה</option>
                    </select>

                    <label>תאריך חזרה:</label><input type="date" id="c-follow">
                    <label>הערות:</label><textarea id="c-notes" rows="4"></textarea>
                    <input type="hidden" id="c-source"><input type="hidden" id="c-price">
                </div>

                <div class="glass-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h4 style="margin:0;">🏦 תמהילים והצעות</h4>
                        <div style="display: flex; gap: 8px;">
                            <select id="bank-select" style="width: auto; margin:0;"><option value="לאומי">לאומי</option><option value="טפחות">טפחות</option><option value="פועלים">פועלים</option><option value="דיסקונט">דיסקונט</option><option value="בינלאומי">בינלאומי</option></select>
                            <button class="btn btn-primary" onclick="addBank()">+ בנק</button>
                        </div>
                    </div>
                    <div id="banks-container"></div>
                </div>
            </div>
        </section>
    </main>
<script>
let currentCust = "";
let allCusts = JSON.parse(localStorage.getItem('dom_crm_list')) || [];
let todos = JSON.parse(localStorage.getItem('dom_todos')) || [];
let currentFilter = 'all';
let previousPage = 'dash';

// ניווט בין עמודים
function showSection(id) {
    if (id !== 'editor') previousPage = id;
    document.querySelectorAll('main section').forEach(s => s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
    if(id === 'dash') document.getElementById('btn-nav-dash').classList.add('active');
    if(id === 'full-list') document.getElementById('btn-nav-list').classList.add('active');
    renderGrids();
}

function goBack() { showSection(previousPage); }

// מחשבון שפיצר
function calculateSpitzer(p, annualRate, years) {
    if (!p || !annualRate || !years || p <= 0 || annualRate <= 0 || years <= 0) return 0;
    const r = (annualRate / 100) / 12;
    const n = years * 12;
    return p * (r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
}

function sideCalc() {
    const p = parseFloat(document.getElementById('side-amt').value);
    const r = parseFloat(document.getElementById('side-rate').value);
    const y = parseFloat(document.getElementById('side-years').value);
    const res = calculateSpitzer(p, r, y);
    document.getElementById('side-res').innerText = "₪ " + Math.round(res).toLocaleString();
}

// עריכת שם לקוח (עדכון גלובלי)
function renameCustomer() {
    const newName = prompt("הכנס שם חדש ללקוח:", currentCust);
    if (!newName || newName === currentCust) return;
    if (allCusts.includes(newName)) { alert("השם כבר קיים במערכת"); return; }

    const data = localStorage.getItem('dom_data_' + currentCust);
    localStorage.setItem('dom_data_' + newName, data);
    localStorage.removeItem('dom_data_' + currentCust);

    const index = allCusts.indexOf(currentCust);
    allCusts[index] = newName;
    localStorage.setItem('dom_crm_list', JSON.stringify(allCusts));

    // עדכון קישורי בני זוג
    allCusts.forEach(n => {
        let d = JSON.parse(localStorage.getItem('dom_data_' + n));
        if (d && d.partner === currentCust) {
            d.partner = newName;
            localStorage.setItem('dom_data_' + n, JSON.stringify(d));
        }
    });

    currentCust = newName;
    document.getElementById('edit-title').innerText = "תיק לקוח: " + newName;
    renderGrids();
}

// פתיחת תיק לקוח
function openCustomer(name) {
    currentCust = name;
    document.getElementById('edit-title').innerText = "תיק לקוח: " + name;
    const d = JSON.parse(localStorage.getItem('dom_data_' + name)) || {};
    
    document.getElementById('c-agent').value = d.agent || "דורון";
    document.getElementById('c-phone').value = d.phone || "";
    document.getElementById('c-bank-main').value = d.bankMain || "";
    document.getElementById('c-goal').value = d.goal || "רכישה יד ראשונה";
    document.getElementById('c-follow').value = d.follow || "";
    document.getElementById('c-notes').value = d.notes || "";
    
    // רשימת בני זוג
    const pSel = document.getElementById('c-partner');
    pSel.innerHTML = '<option value="">ללא קישור</option>';
    allCusts.forEach(c => {
        if(c !== name) {
            const opt = document.createElement('option');
            opt.value = c; opt.innerText = c;
            if(d.partner === c) opt.selected = true;
            pSel.appendChild(opt);
        }
    });

    document.getElementById('banks-container').innerHTML = "";
    if(d.banks) d.banks.forEach(b => addBank(b.name, b.status, b.tracks));
    
    const arcBtn = document.getElementById('arc-toggle-btn');
    arcBtn.innerText = d.isArchived ? "📂 החזר מארכיון" : "📁 העבר לארכיון";
    arcBtn.style.background = d.isArchived ? "var(--success)" : "#94a3b8";
    arcBtn.style.color = "white";
    showSection('editor');
}

// רינדור גריד וניהול תזכורות לחיצות
function renderGrids() {
    const dashGrid = document.getElementById('dash-grid'), fullGrid = document.getElementById('full-grid');
    const alertBar = document.getElementById('reminder-alert');
    if(!dashGrid) return;
    dashGrid.innerHTML = ""; fullGrid.innerHTML = "";
    
    let stats = { all: 0, app: 0, proc: 0, lead: 0, arc: 0 };
    let reminders = [];
    const today = new Date().toISOString().split('T')[0];

    const agentF = document.getElementById('filter-agent').value, 
          searchDash = document.getElementById('search-dash').value.toLowerCase(), 
          searchFull = document.getElementById('search-full').value.toLowerCase();

    allCusts.forEach(name => {
        const d = JSON.parse(localStorage.getItem('dom_data_' + name)) || {};
        const isApproved = (d.banks || []).some(b => b.status === 'אושר');
        const hasBanks = (d.banks || []).length > 0;
        const isProcess = hasBanks && !isApproved;
        const isLead = !hasBanks && !d.isArchived;

        if (d.follow && d.follow <= today && !d.isArchived) reminders.push(name);

        if(d.isArchived) stats.arc++;
        else {
            stats.all++;
            if(isApproved) stats.app++; else if(isProcess) stats.proc++; else if(isLead) stats.lead++;
        }

        const card = document.createElement('div');
        card.className = 'cust-card';
        card.onclick = () => openCustomer(name);
        const stCls = isApproved ? 'var(--success)' : (isProcess ? 'var(--warning)' : (isLead ? '#6366f1' : '#94a3b8'));
        
        card.innerHTML = `<div class="status-pill" style="background:${stCls};">${isApproved?'מאושר':(isProcess?'בטיפול':(isLead?'ליד':'ארכיון'))}</div>
            <h4 style="margin:0;">${name} ${d.partner ? '<small style="color:var(--primary);">❤️ '+d.partner+'</small>':''}</h4>
            <div style="font-size:12px; color:#64748b; margin-top:5px;">👤 ${d.agent} | 📞 ${d.phone || '-'}</div>
            <div style="font-size:11px; color:#94a3b8; margin-top:3px;">🏦 עו"ש: ${d.bankMain || 'לא הוגדר'}</div>
            ${d.follow ? `<div style="font-size:10px; color:${d.follow <= today ? 'var(--danger)':'#64748b'}; font-weight:bold; margin-top:5px;">📅 חזרה: ${d.follow}</div>`:''}`;

        if (!searchFull || name.toLowerCase().includes(searchFull)) fullGrid.appendChild(card.cloneNode(true));

        let show = true;
        if(currentFilter === 'archive' && !d.isArchived) show = false;
        if(currentFilter !== 'archive' && d.isArchived) show = false;
        if(currentFilter === 'approved' && !isApproved) show = false;
        if(currentFilter === 'process' && !isProcess) show = false;
        if(currentFilter === 'lead' && !isLead) show = false;
        if(agentF !== 'all' && d.agent !== agentF) show = false;
        if(searchDash && !name.toLowerCase().includes(searchDash)) show = false;
        if(show) dashGrid.appendChild(card);
    });

    // עדכון סטטיסטיקה ופס תזכורת
    document.getElementById('stat-all').innerText = stats.all;
    document.getElementById('stat-app').innerText = stats.app;
    document.getElementById('stat-proc').innerText = stats.proc;
    document.getElementById('stat-lead').innerText = stats.lead;
    document.getElementById('stat-arc').innerText = stats.arc;

    if (reminders.length > 0) {
        alertBar.classList.remove('hidden');
        alertBar.innerHTML = `<span>🔔 תזכורת חזרה: </span>` + 
            reminders.map(n => `<span class="clickable" onclick="event.stopPropagation(); openCustomer('${n}')">${n}</span>`).join(', ');
    } else { alertBar.classList.add('hidden'); }
}

// ניהול בנקים ומסלולים
function addBank(bName = null, bStatus = "ממתין", tracks = []) {
    const name = bName || document.getElementById('bank-select').value;
    const bId = 'b_' + Math.random().toString(36).substr(2, 5);
    const div = document.createElement('div');
    div.className = 'bank-item'; div.id = bId; div.dataset.bankName = name;
    div.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding-bottom:10px; margin-bottom:10px;">
            <strong style="color:var(--primary);">🏦 ${name}</strong>
            <div style="display:flex; gap:8px;">
                <button class="btn" style="padding:4px 10px; font-size:11px; background:var(--primary); color:white;" onclick="downloadBankImage('${bId}')">📸</button>
                <select class="b-stat" style="width:90px; padding:4px; margin:0;"><option value="ממתין" ${bStatus==='ממתין'?'selected':''}>ממתין</option><option value="אושר" ${bStatus==='אושר'?'selected':''}>אושר</option></select>
                <button onclick="document.getElementById('${bId}').remove()" style="border:none; background:none; color:var(--danger); cursor:pointer;">🗑️</button>
            </div>
        </div>
        <div class="tracks-area"></div>
        <div class="bank-summary-line" style="margin-top:15px; font-size:13px; text-align:left;"></div>
        <button class="btn" style="width:100%; margin-top:10px; font-size:11px; background:#e2e8f0;" onclick="addTrack('${bId}')">+ הוסף מסלול</button>`;
    document.getElementById('banks-container').appendChild(div);
    if(tracks.length > 0) tracks.forEach(t => addTrack(bId, t)); else addTrack(bId);
}

function addTrack(bId, t = {type:'קבועה לא צמודה', amt:'', rate:'', years:30}) {
    const area = document.querySelector(`#${bId} .tracks-area`);
    const row = document.createElement('div');
    row.className = 'track-row';
    const types = ["קבועה לא צמודה", "קבועה צמודה", "משתנה כל 5 ל\"צ", "משתנה כל 5 צמודה", "פריים", "זכאות", "גישור"];
    row.innerHTML = `<select class="t-type">${types.map(type => `<option value="${type}" ${t.type===type?'selected':''}>${type}</option>`).join('')}</select>
        <input type="number" class="t-amt" value="${t.amt}" placeholder="סכום" oninput="updateBankTotals('${bId}')">
        <input type="number" class="t-rate" step="0.1" value="${t.rate}" placeholder="%" oninput="updateBankTotals('${bId}')">
        <input type="number" class="t-years" value="${t.years}" placeholder="שנים" oninput="updateBankTotals('${bId}')">
        <button onclick="this.parentElement.remove(); updateBankTotals('${bId}')" style="border:none; background:none;">❌</button>`;
    area.appendChild(row);
    updateBankTotals(bId);
}

function updateBankTotals(bId) {
    const b = document.getElementById(bId);
    let totalAmt = 0, totalMonthly = 0;
    b.querySelectorAll('.track-row').forEach(tr => {
        const amt = parseFloat(tr.querySelector('.t-amt').value) || 0;
        const rate = parseFloat(tr.querySelector('.t-rate').value) || 0;
        const years = parseFloat(tr.querySelector('.t-years').value) || 0;
        totalAmt += amt; totalMonthly += calculateSpitzer(amt, rate, years);
    });
    b.querySelector('.bank-summary-line').innerText = `סכום: ${Math.round(totalAmt).toLocaleString()} | החזר: ${Math.round(totalMonthly).toLocaleString()} ₪`;
}

// הורדת תמונה (Canvas)
function downloadBankImage(bId) {
    const b = document.getElementById(bId);
    const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d'), trs = b.querySelectorAll('.track-row');
    const agent = document.getElementById('c-agent').value;
    let details = agent === "דורון" ? "דורון שטרית - 0504211784" : (agent === "יעקב" ? "יעקב מנשה - 0523179777" : "אביב פבל - 0507696147");

    canvas.width = 650; canvas.height = 450 + (trs.length * 60);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "#4361ee"; ctx.lineWidth = 14; ctx.strokeRect(0,0,650,canvas.height);
    ctx.direction = "rtl"; ctx.textAlign = "right"; ctx.fillStyle = "#1e293b";
    
    ctx.font = "bold 32px sans-serif"; ctx.fillText("🏦 הצעת תמהיל: " + b.dataset.bankName, 610, 70);
    ctx.font = "18px sans-serif"; ctx.fillText("שם הלקוח: " + currentCust, 610, 105);
    
    let y = 160;
    ctx.font = "bold 14px sans-serif"; ctx.fillStyle = "#64748b";
    ctx.fillText("מסלול", 600, y-20); ctx.fillText("סכום", 400, y-20); ctx.fillText("ריבית", 310, y-20); ctx.fillText("שנים", 250, y-20); ctx.fillText("החזר חודשי", 150, y-20);

    let totalA = 0, totalM = 0;
    trs.forEach(tr => {
        ctx.fillStyle = "#f1f5f9"; ctx.fillRect(30, y-25, 590, 45);
        ctx.fillStyle = "#1e293b"; ctx.font = "15px sans-serif";
        const amt = parseFloat(tr.querySelector('.t-amt').value) || 0, rate = tr.querySelector('.t-rate').value, years = tr.querySelector('.t-years').value;
        const monthly = calculateSpitzer(amt, parseFloat(rate), parseFloat(years));
        ctx.fillText(tr.querySelector('.t-type').value, 600, y+5);
        ctx.fillText(Math.round(amt).toLocaleString() + " ₪", 400, y+5);
        ctx.fillText(rate + "%", 310, y+5); ctx.fillText(years, 250, y+5);
        ctx.font = "bold 15px sans-serif"; ctx.fillText(Math.round(monthly).toLocaleString() + " ₪", 150, y+5);
        totalA += amt; totalM += monthly; y += 55;
    });

    ctx.fillStyle = "#eff6ff"; ctx.fillRect(30, y-10, 590, 50);
    ctx.fillStyle = "#4361ee"; ctx.font = "bold 18px sans-serif";
    ctx.fillText(`סה"כ הלוואה: ${Math.round(totalA).toLocaleString()} ₪ | החזר: ${Math.round(totalM).toLocaleString()} ₪`, 600, y+23);
    ctx.fillStyle = "#1e293b"; ctx.fillRect(10, canvas.height - 110, 630, 100);
    ctx.textAlign = "center"; ctx.fillStyle = "#ffffff";
    ctx.font = "bold 22px sans-serif"; ctx.fillText("הבית למשכנתא שלך", 325, canvas.height - 65);
    ctx.font = "16px sans-serif"; ctx.fillStyle = "#cbd5e1"; ctx.fillText(details, 325, canvas.height - 35);

    const l = document.createElement('a'); l.download = `תמהיל_${currentCust}.png`; l.href = canvas.toDataURL(); l.click();
}

// שמירת נתונים
function saveAllData() {
    const banks = [];
    document.querySelectorAll('.bank-item').forEach(b => {
        const bank = { name: b.dataset.bankName, status: b.querySelector('.b-stat').value, tracks: [] };
        b.querySelectorAll('.track-row').forEach(tr => {
            bank.tracks.push({ type: tr.querySelector('.t-type').value, amt: tr.querySelector('.t-amt').value, rate: tr.querySelector('.t-rate').value, years: tr.querySelector('.t-years').value });
        });
        banks.push(bank);
    });
    const d = JSON.parse(localStorage.getItem('dom_data_' + currentCust)) || {};
    localStorage.setItem('dom_data_' + currentCust, JSON.stringify({
        agent: document.getElementById('c-agent').value,
        phone: document.getElementById('c-phone').value,
        bankMain: document.getElementById('c-bank-main').value,
        partner: document.getElementById('c-partner').value,
        goal: document.getElementById('c-goal').value,
        follow: document.getElementById('c-follow').value, 
        notes: document.getElementById('c-notes').value,
        banks: banks, isArchived: d.isArchived || false
    }));
    alert("נשמר בהצלחה!");
    renderGrids();
}

// משימות (To-Do)
function renderTodos() {
    const list = document.getElementById('todo-list'); list.innerHTML = "";
    todos.forEach((t, i) => {
        const div = document.createElement('div'); div.className = 'todo-item';
        div.innerHTML = `<input type="checkbox" onchange="completeTodo(${i})"> <span>${t.text}</span>`;
        list.appendChild(div);
    });
}
function addTodo() {
    const inp = document.getElementById('todo-input'); if(!inp.value) return;
    todos.push({ text: inp.value }); localStorage.setItem('dom_todos', JSON.stringify(todos));
    inp.value = ""; renderTodos();
}
function completeTodo(i) { todos.splice(i, 1); localStorage.setItem('dom_todos', JSON.stringify(todos)); renderTodos(); }

// גיבוי, שחזור ופעולות כלליות
function setFilter(f) { currentFilter = f; showSection('dash'); }
function addNewCustomer() {
    const n = prompt("שם לקוח:");
    if(n && !allCusts.includes(n)) { allCusts.push(n); localStorage.setItem('dom_crm_list', JSON.stringify(allCusts)); openCustomer(n); }
}
function toggleArchive() {
    const d = JSON.parse(localStorage.getItem('dom_data_' + currentCust)) || {};
    d.isArchived = !d.isArchived; localStorage.setItem('dom_data_' + currentCust, JSON.stringify(d)); goBack();
}
function exportFullBackup() {
    const backup = { list: allCusts, todos: todos, data: {} };
    allCusts.forEach(name => { backup.data[name] = JSON.parse(localStorage.getItem('dom_data_' + name)); });
    const blob = new Blob([JSON.stringify(backup)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `CRM_Backup.json`; a.click();
}
function importFullBackup(event) {
    const file = event.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        const b = JSON.parse(e.target.result);
        if(confirm("שחזור ימחק נתונים קיימים. להמשיך?")) {
            localStorage.setItem('dom_crm_list', JSON.stringify(b.list));
            localStorage.setItem('dom_todos', JSON.stringify(b.todos));
            for(let k in b.data) localStorage.setItem('dom_data_'+k, JSON.stringify(b.data[k]));
            location.reload();
        }
    };
    reader.readAsText(file);
}

window.onload = () => { renderGrids(); renderTodos(); };
</script>
